<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FROST — OpenPGP Wallet</title>
<meta name="description" content="FROST : diviser la signature. OpenPGP Wallet, projet en cours de développement.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="alternate" hreflang="fr" href="frost.html">
<link rel="alternate" hreflang="en" href="frost-en.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060708;
    --line-2: #2a3039;
    --text: #f4f5f7;
    --muted: #a3aab5;
    --accent: #7c93ff;
    --accent-soft: rgba(124, 147, 255, 0.14);
    --warn: #ffb648;
    --gutter: clamp(20px, 5vw, 64px);
    --font-display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  }

  /* Passage en fondu entre les pages du site (navigateurs qui le prennent en charge). */
  @view-transition { navigation: auto; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* ===== Navigation (mêmes règles que index.html) ===== */
  .nav {
    position: fixed; inset: 0 0 auto 0; z-index: 40;
    height: 72px; display: flex; align-items: center; gap: 24px;
    padding: 0 clamp(20px, 3vw, 40px);
    background: rgba(6, 7, 8, 0.72);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .brand { display: flex; align-items: center; gap: 11px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(145deg, #1d2330, #0d1016); border: 1px solid var(--line-2); }
  .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .badge-private {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap;
    color: var(--warn); border: 1px solid rgba(255, 182, 72, 0.35); background: rgba(255, 182, 72, 0.06);
    padding: 6px 12px; border-radius: 999px;
  }
  .lang-switch { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; transition: color 0.2s, border-color 0.2s; }
  .lang-switch:hover { color: var(--text); border-color: #3d4450; }
  .frost-link {
    height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.18em;
    color: var(--text); background: var(--accent-soft); border: 1px solid rgba(124, 147, 255, 0.45);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .frost-link:hover, .frost-link[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #060708; }

  /* ===== « Divisez / la signature » =====
     La phrase s'écrit d'abord sur une ligne, une barre oblique la coupe, puis
     les deux moitiés s'écartent de part et d'autre de la barre : « Divisez »
     en haut, « la signature » en bas. Un clic rejoue l'animation. */
  .frost-stage {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center;
    padding: 96px var(--gutter) 48px;
  }
  .split {
    display: flex; align-items: center;
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    font-size: clamp(24px, 8.4vw, 112px); line-height: 1; letter-spacing: -0.01em;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .part { display: inline-block; white-space: nowrap; }
  .slash {
    display: inline-block; flex-shrink: 0;
    width: 0.07em; height: 2.4em; margin: 0 0.13em; border-radius: 999px;
    background: linear-gradient(180deg, #c3ceff, var(--accent));
    box-shadow: 0 0 0.3em rgba(124, 147, 255, 0.55);
    transform: rotate(22deg);
    clip-path: inset(0 0 100% 0);
  }
  .frost-content {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(28px, 5vw, 56px); text-align: center;
  }
  .frost-credit {
    margin: 0; font-size: clamp(12px, 1.2vw, 15px); font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .frost-credit strong { color: var(--text); font-family: var(--font-display); font-weight: 700; }
  .frost-soon {
    margin: 0; padding: 8px 18px 8px calc(18px + 0.32em); border-radius: 999px;
    font-family: var(--font-display); font-size: clamp(13px, 1.3vw, 16px); font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent);
    background: var(--accent-soft); border: 1px solid rgba(124, 147, 255, 0.45);
  }
  .play .frost-credit { animation: frost-fade 0.8s ease 0.15s both; }
  .play .frost-soon { animation: frost-fade 0.8s ease 2.5s both; }
  @keyframes frost-fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .play .part { animation: frost-appear 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .play .slash { animation: frost-cut 0.42s cubic-bezier(0.7, 0, 0.3, 1) 1.2s both; }
  .play .left { animation: frost-appear 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both, frost-left 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) 1.62s forwards; }
  .play .right { animation: frost-appear 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.08s both, frost-right 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) 1.62s forwards; }

  @keyframes frost-appear {
    from { opacity: 0; transform: translateY(0.25em); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  @keyframes frost-cut {
    from { clip-path: inset(0 0 100% 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes frost-left { from { transform: none; } to { transform: translate(0.12em, -0.58em); } }
  @keyframes frost-right { from { transform: none; } to { transform: translate(-0.12em, 0.58em); } }

  @media (max-width: 640px) {
    .nav { height: 64px; gap: 12px; }
    .badge-private { display: none; }
    .lang-switch { height: 36px; padding: 0 12px; }
    .frost-link { height: 36px; padding: 0 12px; }
  }

  /* Mouvement réduit : état final directement. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="index.html" aria-label="OpenPGP Wallet, accueil">
    <span class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f4f5f7" stroke-width="2" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </span>
    OpenPGP Wallet
  </a>
  <div class="nav-actions">
    <span class="badge-private">EN DÉVELOPPEMENT</span>
    <a class="lang-switch" href="frost-en.html" hreflang="en" lang="en" aria-label="English version">EN</a>
    <a class="frost-link" href="frost.html" aria-current="page">FROST</a>
  </div>
</header>

<main class="frost-stage">
  <div class="frost-content play">
    <p class="frost-credit" lang="en"><strong>FROST</strong> by the Zcash Foundation</p>
    <div class="split" role="img" aria-label="Divisez la signature" tabindex="0" title="Rejouer">
      <span class="part left" aria-hidden="true">Divisez</span>
      <span class="slash" aria-hidden="true"></span>
      <span class="part right" aria-hidden="true">la signature</span>
    </div>
    <p class="frost-soon" lang="en">Coming soon</p>
  </div>
</main>

<script>
  // Rejoue l'animation au clic (ou Entrée / Espace).
  const split = document.querySelector(".split");
  const content = document.querySelector(".frost-content");
  const replay = () => {
    content.classList.remove("play");
    void content.offsetWidth;
    content.classList.add("play");
  };
  split.addEventListener("click", replay);
  split.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      replay();
    }
  });
</script>
</body>
</html>
