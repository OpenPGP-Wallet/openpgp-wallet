[package]
name = "pgp-wallet-poc"
version = "0.1.0"
edition = "2021"
default-run = "pgp-wallet-poc"

[dependencies]
# blahaj (pas "sharks") : Shamir's Secret Sharing, seuil configurable. `sharks` a
# un biais connu et non corrigé dans le tirage des coefficients polynomiaux
# (RUSTSEC-2024-0398, trouvé via `cargo audit`) — exploitable si le même secret
# est partagé des centaines de fois, ce qui reste peu probable ici (un split à la
# création + régénérations protégées par mot de passe et confirmation native),
# mais sans correctif amont disponible pour `sharks` lui-même. `blahaj` est le
# fork officiellement recommandé par l'avis RustSec, avec la faille corrigée et
# une API strictement identique (Sharks/Share/dealer/recover) — migration sans
# changement de logique métier, seulement le nom du crate importé.
blahaj = "0.6"
getrandom = "0.2"          # source d'entropie sécurisée
zeroize = { version = "1.7", features = ["derive"] }  # effacement mémoire garanti
anyhow = "1.0"             # gestion d'erreurs simplifiée pour le PoC

# --- Ajouts pour l'expérimentation "wallet_demo" (dérivation + virement EVM sans PGP) ---
# bip32   : dérivation HD (BIP32) de la clé maîtresse -> clé privée par chemin de dérivation.
#           Déjà prévu dans la roadmap du projet (src/derivation.rs).
# k256    : implémentation secp256k1 (signature ECDSA) utilisée par `bip32` ; on en a besoin
#           explicitement pour signer le hash de transaction Ethereum.
# sha3    : Keccak256, requis pour calculer l'adresse EVM et le hash de transaction.
# rlp     : encodage RLP, format binaire imposé par les transactions Ethereum legacy.
# reqwest : client HTTP pour parler en JSON-RPC à un nœud Sepolia (interroger le solde,
#           le nonce, et diffuser la transaction signée).
# serde/serde_json : (dé)sérialisation des requêtes/réponses JSON-RPC.
# hex     : conversions hexadécimales (adresses, clés, tx brutes) pour l'affichage et le RPC.
# bip39   : génération optionnelle d'une phrase mnémonique (12 mots) dans `wallet_demo`, à but
#           pédagogique/comparatif uniquement — le projet évite ce concept en production,
#           l'utilisateur ne voit et ne saisit jamais de mots de récupération.
# bech32/sha2/ripemd : nécessaires pour dériver une adresse Bitcoin testnet (P2WPKH,
#           préfixe "tb1q...") depuis la même seed maîtresse : hash160 = RIPEMD160(SHA256(pubkey)),
#           puis encodage bech32 (BIP173) avec le préfixe "tb" (testnet).
bip32 = "0.5"
bip39 = "2"
bech32 = "0.9"
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rlp = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# num-bigint : calculs de montants CoW en précision étendue (déjà présent via
# les dépendances Zcash, voir `cow::mul_div`).
num-bigint = "0.4"

# --- Ajouts pour la démo Solana (ed25519, pas secp256k1 : dérivation et signature
# totalement différentes de BTC/EVM) ---
# ed25519-dalek : signature ed25519, algorithme natif de Solana.
# hmac          : dérivation SLIP-0010 (HMAC-SHA512), seul schéma HD valable pour ed25519
#                 (BIP32 classique ne fonctionne pas sur cette courbe : dérivation non-durcie
#                 impossible, d'où un chemin entièrement durci m/44'/501'/0'/0').
# bs58          : encodage des adresses et clés Solana (base58, sans checksum contrairement
#                 à l'adresse Bitcoin legacy).
# base64        : encodage requis par l'API JSON-RPC de Solana pour soumettre une transaction.
ed25519-dalek = "2"
hmac = "0.12"
bs58 = "0.5"
base64 = "0.22"
# curve25519-dalek : déjà présent transitivement (via ed25519-dalek) à la
# même version — ajouté ici en dépendance directe uniquement pour
# CompressedEdwardsY::decompress(), le test "point sur la courbe" utilisé par
# find_program_address (dérivation d'Associated Token Account Solana, voir
# sol_spl.rs). Ce test doit être correct bit-à-bit — une erreur produit une
# adresse de destination différente, potentiellement irrécupérable — donc on
# réutilise l'implémentation déjà auditée de la crate plutôt que de recoder la
# validation de point elliptique à la main, seule exception au principe
# "from scratch" du reste de ce module (agencement d'octets, pas de
# cryptographie sur courbe).
curve25519-dalek = "4.1.3"
blake2b_simd = "1"
# Bittensor (TAO, chaîne Substrate) : signatures sr25519, encodage SCALE,
# métadonnées du réseau (format des transactions), graine depuis l'entropie.
schnorrkel = "0.11"
parity-scale-codec = { version = "3", features = ["derive"] }
frame-metadata = { version = "23", features = ["decode", "current"] }
scale-info = { version = "2", default-features = false, features = ["decode"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# --- Zcash (adresses transparentes t1) ---
# Bibliothèques officielles librustzcash (Zcash Foundation / ECC) plutôt qu'un
# format recodé à la main : transaction v5, signature ZIP-244, frais ZIP-317,
# branches de consensus et formats d'adresse (t1, t3, tex1). Sans les circuits
# de preuve (transparent seulement).
# tonic/tonic-prost/prost/tokio : client gRPC des serveurs lightwalletd (seule
# infrastructure officielle des portefeuilles Zcash ; pas de gRPC-web), messages
# définis à la main (sans protoc), petit runtime tokio par appel.
zcash_primitives = { version = "0.30", default-features = false, features = ["std", "transparent-inputs"] }
zcash_transparent = { version = "0.10", default-features = false, features = ["std", "transparent-inputs"] }
zcash_protocol = "0.10"
zcash_address = "0.13"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt", "time", "macros"] }
# Types nommés par le module Zcash (mêmes versions que celles de zcash_primitives) :
# clé de signature transparente (secp256k1), bundles protégés toujours absents
# (sapling-crypto, orchard), script de sortie et vérification des signatures dans
# les tests (zcash_script, interpréteur officiel utilisé par Zebra).
secp256k1 = "0.29"
sapling-crypto = { version = "0.7", default-features = false }
orchard = { version = "0.15", default-features = false }
zcash_script = "0.4"
# Zcash protégé (Orchard) : pile officielle des portefeuilles légers (celle de
# Zashi) — synchronisation par les serveurs lightwalletd, base de portefeuille
# SQLite (clés de VISUALISATION seulement : la clé de dépense est dérivée de la
# seed au moment de signer), import de l'adresse t1 existante de chaque profil
# pour la protéger. rusqlite « bundled » : SQLite compilé avec l'app (Windows
# n'en fournit pas).
zcash_client_backend = { version = "0.24", default-features = false, features = ["orchard", "sync", "transparent-inputs", "transparent-key-import"] }
zcash_client_sqlite = { version = "0.22", default-features = false, features = ["orchard", "multicore", "transparent-inputs", "transparent-key-import"] }
zcash_keys = { version = "0.16", features = ["orchard", "transparent-inputs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# zip32 : index de compte et empreinte de seed ; async-trait : cache de blocs
# de la synchronisation ; rand_core : générateur système exigé par la base.
zip32 = "0.2"
async-trait = "0.1"
# Types de l'interface du prouveur Sapling, remplacé par un prouveur qui refuse
# (Orchard seul, voir zcash_shielded::NoSapling).
jubjub = "0.10"
bls12_381 = "0.8"

# --- Monero ---
# monero-wallet / monero-oxide (Serai, issus de monero-serai audité) : clés,
# adresses, recherche des sorties reçues avec la clé de VISUALISATION,
# transactions CLSAG + Bulletproofs+ ; monero-simple-request-rpc : nœud
# Monero (public par défaut, modifiable dans Paramètres).
monero-wallet = "0.2"
monero-simple-request-rpc = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }

# --- WalletConnect v2 (voir core/src/walletconnect/) ---
# Protocole implémenté en Rust plutôt que via le SDK JavaScript officiel (choix de
# l'utilisateur) : aucune dépendance npm dans la webview où le mot de passe est
# saisi, CSP inchangée. Primitives exigées par la spécification, vérifiées octet
# par octet contre des vecteurs produits par les bibliothèques du SDK officiel :
# chacha20poly1305 : chiffrement des enveloppes (RustCrypto).
# hkdf             : dérivation de la clé symétrique d'une session (déjà présent
#                    transitivement, même version).
# L'échange X25519 réutilise `curve25519-dalek` ci-dessus (`MontgomeryPoint`,
# clampage RFC 7748), sans crate supplémentaire.
chacha20poly1305 = "0.10"
hkdf = "0.12"
# tungstenite : WebSocket (synchrone) vers le relais WalletConnect, TLS via
# `native-tls` — la même pile que reqwest dans ce projet (magasin de
# certificats de Windows), aucune seconde implémentation TLS ajoutée.
# Version 0.29 (mars 2026), pas 0.30 : la 0.30 exige sha1/digest 0.11, en
# conflit avec la pile Zcash officielle stable (bip32 0.6.0-pre.1 →
# digest 0.11.0-pre.9) ; l'API utilisée ici (client_tls, Message) est la même.
tungstenite = { version = "0.29", features = ["native-tls"] }

# region : verrouillage mémoire réel (mlock Unix / VirtualLock Windows) pour les buffers
# sensibles (entropie, seed reconstruite) — zeroize efface mais ne protège pas contre le
# swap disque pendant la durée de vie du buffer. Complète memory_guard::wipe, ne le remplace pas.
region = "3"

# keyring : stocke la clé privée PGP de l'appareil dans le coffre natif de l'OS
# (Windows Credential Manager / macOS Keychain / Linux Secret Service) plutôt
# qu'un simple fichier .asc — un vrai contrôle d'accès du système d'exploitation
# (lié à la session utilisateur), pas seulement un chemin de fichier à deviner.
# Voir core/src/secure_storage.rs : repli automatique sur un fichier si le
# coffre OS est indisponible, jamais de blocage de la création/du
# déverrouillage du wallet à cause de ça.
#
# Sans feature explicite, `keyring` retombe sur un backend qui n'écrit nulle
# part de réel — vérifié empiriquement (`cargo run --bin keyring_spike --
# write` puis `read` échouait avec "No matching entry found" avant cet ajout,
# malgré une écriture "réussie"). Les 3 features ci-dessous correspondent
# chacune à un backend spécifique à un OS (`dep:` cible elle-même restreinte à
# cet OS dans le Cargo.toml de `keyring`) : les activer toutes les 3 sans
# condition est sans risque, Cargo n'inclut de toute façon que celle(s)
# pertinente(s) pour la cible réellement compilée.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }

# hidapi : communication USB HID avec un portefeuille matériel Ledger (voir
# core/src/ledger/). Bibliothèque de référence multiplateforme (API HID native de
# Windows, IOKit, hidraw) ; le protocole Ledger au-dessus est implémenté ici.
hidapi = "2"
# rusb : accès USB direct (libusb, compilée depuis ses sources) à un Trezor
# (modèle T, Safe 3, Safe 5 : interface WebUSB, pilote WinUSB installé
# automatiquement par Windows). Le protocole Trezor au-dessus est implémenté
# ici (voir core/src/trezor/).
rusb = { version = "0.9", features = ["vendored"] }

# --- Backend crypto de sequoia-openpgp : un par famille d'OS, jamais "crypto-rust" ---
# (marqué "non production ready"/"non constant-time" par sequoia lui-même). Les deux backends
# ci-dessous sont considérés production-ready par sequoia (pas de flag
# "allow-experimental-crypto"/"allow-variable-time-crypto" à activer).
#
# Windows : "crypto-cng", l'API native CNG (Cryptography API: Next Generation), déjà
# présente sur le système, sans dépendance externe à installer.
[target.'cfg(windows)'.dependencies]
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-cng", "compression"] }
# Déverrouillage biométrique (Windows Hello/TPM, voir windows_hello.rs) : liaisons
# officielles Microsoft pour NCrypt/BCrypt (clé persistée dans le TPM via le
# fournisseur "Microsoft Platform Crypto Provider") et UserConsentVerifier (simple
# heuristique d'affichage, pas la barrière de sécurité elle-même). Déjà présent
# *transitivement* (v0.61.3, via Tauri/WebView2/tao pour le fenêtrage) mais sans ces
# feature flags : ceci en fait une dépendance directe.
# "Win32_Storage_FileSystem" : détection des clés USB (lecteurs amovibles) pour la
# sauvegarde du kit de récupération, voir usb_backup.rs ("Win32_System_Diagnostics_Debug" :
# SetThreadErrorMode, pas de boîte système pour un lecteur vide).
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Security_Credentials_UI",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
] }

# macOS/Linux/iOS/Android : "crypto-cng" n'existe pas hors Windows (API Windows
# uniquement) ; "crypto-nettle" (utilisé par défaut sur Linux) demanderait de
# cross-compiler libnettle+GMP en C pour la cible iOS/Android, plus pénible que
# "crypto-openssl" ici. OpenSSL se cross-compile nativement pour iOS/Android via le
# feature "vendored" (construit depuis les sources, pas besoin d'installation système —
# indispensable sur iOS, qui n'a pas de gestionnaire de paquets).
[target.'cfg(not(windows))'.dependencies]
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-openssl", "compression"] }
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Tests Zcash : dérivation officielle (AccountId de ZIP-32) comparée à la nôtre.
zip32 = "0.2"
