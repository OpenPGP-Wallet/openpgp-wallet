[package]
name = "openpgp-wallet-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# blahaj (not "sharks"): Shamir's Secret Sharing with a configurable threshold.
# `sharks` has a known, unfixed bias in how it draws the polynomial coefficients
# (RUSTSEC-2024-0398, found through `cargo audit`), exploitable if the same secret
# is split hundreds of times. That is unlikely here (one split at creation, plus
# regenerations guarded by the password and a native confirmation), but there is
# no upstream fix for `sharks` itself. `blahaj` is the fork the RustSec advisory
# officially recommends, with the flaw fixed and a strictly identical API
# (Sharks/Share/dealer/recover): migrating only changed the imported crate name.
blahaj = "0.6"
getrandom = "0.2"          # secure entropy source
zeroize = { version = "1.7", features = ["derive"] }  # guaranteed memory wiping
anyhow = "1.0"             # simpler error handling

# --- Key derivation, EVM and Bitcoin ---
# bip32   : HD derivation (BIP32) from the master key -> private key per derivation path.
# k256    : secp256k1 implementation (ECDSA signatures) used by `bip32`; also needed
#           directly to sign Ethereum transaction hashes.
# sha3    : Keccak256, required to compute EVM addresses and transaction hashes.
# rlp     : RLP encoding, the binary format of legacy Ethereum transactions.
# reqwest : HTTP client for JSON-RPC calls to nodes (balance, nonce, broadcasting
#           signed transactions).
# serde/serde_json : (de)serialization of JSON-RPC requests/responses.
# hex     : hex conversions (addresses, keys, raw transactions) for display and RPC.
# bip39   : optional 12-word mnemonic generation in the `wallet_demo` example, for
#           teaching/comparison only. The project avoids this concept in production:
#           the user never sees or types recovery words.
# bech32/sha2/ripemd : needed to derive Bitcoin addresses (P2WPKH, "bc1q..."/"tb1q...")
#           from the same master seed: hash160 = RIPEMD160(SHA256(pubkey)), then
#           bech32 encoding (BIP173).
bip32 = "0.5"
bip39 = "2"
bech32 = "0.9"
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rlp = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# num-bigint: extended-precision CoW amount calculations (already present through
# the Zcash dependencies, see `cow::mul_div`).
num-bigint = "0.4"

# --- Solana (ed25519, not secp256k1: derivation and signing are entirely different
# from BTC/EVM) ---
# ed25519-dalek : ed25519 signatures, Solana's native algorithm.
# hmac          : SLIP-0010 derivation (HMAC-SHA512), the only valid HD scheme for
#                 ed25519 (classic BIP32 does not work on this curve: non-hardened
#                 derivation is impossible, hence a fully hardened m/44'/501'/0'/0' path).
# bs58          : encoding of Solana addresses and keys (base58, without the checksum
#                 that legacy Bitcoin addresses have).
# base64        : encoding required by Solana's JSON-RPC API to submit a transaction.
ed25519-dalek = "2"
hmac = "0.12"
bs58 = "0.5"
base64 = "0.22"
# curve25519-dalek: already present transitively (through ed25519-dalek) at the same
# version; added as a direct dependency only for CompressedEdwardsY::decompress(),
# the "point on the curve" test used by find_program_address (Solana Associated
# Token Account derivation, see sol_spl.rs). That test must be bit-exact (a mistake
# produces a different destination address, possibly unrecoverable), so we reuse the
# crate's already audited implementation rather than recoding elliptic point
# validation by hand: the only exception to the "from scratch" approach of the rest
# of that module (byte layout, no curve cryptography).
curve25519-dalek = "4.1.3"
blake2b_simd = "1"
# Bittensor (TAO, a Substrate chain): sr25519 signatures, SCALE encoding, network
# metadata (transaction format), seed from the entropy.
schnorrkel = "0.11"
parity-scale-codec = { version = "3", features = ["derive"] }
frame-metadata = { version = "23", features = ["decode", "current"] }
scale-info = { version = "2", default-features = false, features = ["decode"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# --- Zcash (transparent t1 addresses) ---
# The official librustzcash libraries (Zcash Foundation / ECC) rather than a format
# recoded by hand: v5 transactions, ZIP-244 signatures, ZIP-317 fees, consensus
# branches and address formats (t1, t3, tex1). Without the proving circuits
# (transparent only).
# tonic/tonic-prost/prost/tokio: gRPC client for the lightwalletd servers (the only
# official infrastructure for Zcash wallets; no gRPC-web), messages defined by hand
# (no protoc), a small tokio runtime per call.
zcash_primitives = { version = "0.31", default-features = false, features = ["std", "transparent-inputs"] }
zcash_transparent = { version = "0.11", default-features = false, features = ["std", "transparent-inputs"] }
zcash_protocol = "0.11"
zcash_address = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt", "time", "macros"] }
# Types named by the Zcash module (the same versions as zcash_primitives'):
# transparent signing key (secp256k1), shielded bundles that are always absent
# (sapling-crypto, orchard), output scripts and signature verification in the tests
# (zcash_script, the official interpreter used by Zebra).
secp256k1 = "0.33"
sapling-crypto = { version = "0.9", default-features = false }
orchard = { version = "0.16", default-features = false }
zcash_script = "0.6"
# Shielded Zcash (Orchard and Ironwood): the official light wallet stack (the one
# Zashi uses). Sync through the lightwalletd servers, a SQLite wallet database
# (VIEWING keys only: the spending key is derived from the seed at signing time),
# and import of each profile's existing t1 address so it can be shielded.
# rusqlite "bundled": SQLite compiled into the app (Windows does not ship one).
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "sync", "transparent-inputs", "transparent-key-import"] }
zcash_client_sqlite = { version = "0.23", default-features = false, features = ["orchard", "multicore", "transparent-inputs", "transparent-key-import"] }
zcash_keys = { version = "0.17", features = ["orchard", "transparent-inputs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# zip32: account index and seed fingerprint; async-trait: the sync's block cache;
# rand: the system generator (`SysRng`) the database and the transaction builder
# require.
zip32 = "0.3"
async-trait = "0.1"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
# Types of the Sapling prover interface, replaced by a prover that refuses
# (no Sapling, see zcash_shielded::NoSapling).
jubjub = "0.11"
bls12_381 = "0.9"

# --- Monero ---
# monero-wallet / monero-oxide (Serai, derived from the audited monero-serai): keys,
# addresses, scanning for received outputs with the VIEW key, CLSAG + Bulletproofs+
# transactions; monero-simple-request-rpc: Monero node (public by default, can be
# changed in Settings).
monero-wallet = "0.2"
monero-simple-request-rpc = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }

# --- WalletConnect v2 (see core/src/walletconnect/) ---
# The protocol is implemented in Rust rather than through the official JavaScript SDK
# (a deliberate choice): no npm dependency in the webview where the password is
# typed, and an unchanged CSP. The primitives the specification requires are checked
# byte for byte against vectors produced by the official SDK's libraries:
# chacha20poly1305 : envelope encryption (RustCrypto).
# hkdf             : derivation of a session's symmetric key (already present
#                    transitively, same version).
# The X25519 exchange reuses `curve25519-dalek` above (`MontgomeryPoint`, RFC 7748
# clamping), with no extra crate.
chacha20poly1305 = "0.10"
hkdf = "0.12"
# tungstenite: (synchronous) WebSocket to the WalletConnect relay, TLS through
# `native-tls`, the same stack as reqwest in this project (the Windows certificate
# store), so no second TLS implementation is added.
# Version 0.29 (March 2026), not 0.30: 0.30 requires sha1/digest 0.11, which
# conflicts with the stable official Zcash stack (bip32 0.6.0-pre.1 ->
# digest 0.11.0-pre.9); the API used here (client_tls, Message) is the same.
tungstenite = { version = "0.29", features = ["native-tls"] }

# region: real memory locking (mlock on Unix / VirtualLock on Windows) for sensitive
# buffers (entropy, rebuilt seed). zeroize wipes, but does not protect against the
# buffer being swapped to disk during its lifetime. Complements memory_guard::wipe,
# does not replace it.
region = "3"

# keyring: stores the device's PGP private key in the OS's native vault (Windows
# Credential Manager / macOS Keychain / Linux Secret Service) rather than a plain
# .asc file: real access control by the operating system (tied to the user
# session), not just a file path to guess. See core/src/secure_storage.rs: automatic
# fallback to a file if the OS vault is unavailable, so wallet creation/unlock is
# never blocked because of it.
#
# Without an explicit feature, `keyring` falls back to a backend that writes nowhere
# real, as checked empirically (`cargo run --example keyring_spike -- write`, then
# `read`, failed with "No matching entry found" before this was added, despite a
# "successful" write). Each of the 3 features below matches an OS-specific backend
# (a `dep:` target itself restricted to that OS in `keyring`'s Cargo.toml):
# enabling all 3 unconditionally is safe, since Cargo only includes the one(s)
# relevant to the target actually being compiled.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }

# hidapi: USB HID communication with a Ledger hardware wallet (see core/src/ledger/).
# The reference cross-platform library (native Windows HID API, IOKit, hidraw); the
# Ledger protocol on top is implemented here.
hidapi = "2"
# rusb: direct USB access (libusb, compiled from source) to a Trezor (Model T,
# Safe 3, Safe 5: WebUSB interface, WinUSB driver installed automatically by
# Windows). The Trezor protocol on top is implemented here (see core/src/trezor/).
rusb = { version = "0.9", features = ["vendored"] }

# --- sequoia-openpgp crypto backend: one per OS family, never "crypto-rust" ---
# (which sequoia itself flags as "not production ready"/"not constant-time"). Both
# backends below are considered production-ready by sequoia (no
# "allow-experimental-crypto"/"allow-variable-time-crypto" flag to enable).
#
# Windows: "crypto-cng", the native CNG API (Cryptography API: Next Generation),
# already present on the system, with no external dependency to install.
[target.'cfg(windows)'.dependencies]
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-cng", "compression"] }
# Biometric unlock (Windows Hello/TPM, see windows_hello.rs): Microsoft's official
# bindings for NCrypt/BCrypt (key persisted in the TPM through the "Microsoft
# Platform Crypto Provider") and UserConsentVerifier (just a display heuristic, not
# the security barrier itself). Already present *transitively* (v0.61.3, through
# Tauri/WebView2/tao for windowing) but without these feature flags: this makes it a
# direct dependency.
# "Win32_Storage_FileSystem": detecting USB drives (removable drives) for backing up
# the recovery kit, see usb_backup.rs ("Win32_System_Diagnostics_Debug":
# SetThreadErrorMode, so no system dialog for an empty drive).
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Security_Credentials_UI",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
] }

# macOS/Linux/iOS/Android: "crypto-cng" does not exist outside Windows (a
# Windows-only API); "crypto-nettle" (the Linux default) would require
# cross-compiling libnettle+GMP in C for iOS/Android, more painful than
# "crypto-openssl" here. OpenSSL cross-compiles natively for iOS/Android through the
# "vendored" feature (built from source, no system install needed, which is
# essential on iOS, as it has no package manager).
[target.'cfg(not(windows))'.dependencies]
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-openssl", "compression"] }
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Zcash tests: the official derivation (ZIP-32 AccountId) compared with ours.
zip32 = "0.3"
