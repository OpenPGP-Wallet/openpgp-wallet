[package]
name = "wallet"
version = "2.14.1"
description = "Non-custodial, multi-network crypto wallet whose master key is protected by OpenPGP instead of a plaintext seed phrase"
authors = ["Khadim"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native "Save as" dialog for downloading backup shares: regular <a download> links
# do not work reliably in the Tauri webview (navigation intercepted for security
# reasons).
tauri-plugin-dialog = "2"
# Opens external links (block explorers) in the system browser: a regular
# <a target="_blank"> does not work reliably in the Tauri webview (navigation
# intercepted for security reasons), the same problem already hit for downloads (see
# tauri-plugin-dialog above).
tauri-plugin-opener = "2"
# QR code generation for displaying addresses (public, no sensitive data): done on
# the Rust side so the frontend gets no extra JS dependency.
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The crypto worker (Shamir, PGP, derivation, RPC): all the sensitive logic stays in
# this separate crate, never in the web frontend.
openpgp-wallet-core = { path = "../../core" }
# Wipes the passwords received from the frontend (String) as soon as they are no
# longer needed, including on an early return/panic; the same sensitive buffers as
# core/, which already uses zeroize for the entropy/seed.
zeroize = "1.7"

# Window title bar and border in the theme's colors (DWM, Windows 11): the same
# version as the core's, no extra library.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
