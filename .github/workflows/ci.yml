name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    # Windows is the platform the app is built and tested on (CNG crypto backend,
    # Windows Hello, Credential Manager).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests that need the real network are #[ignore]d and are not run here.
      # Partner API keys are not available in CI: the providers that need them
      # are simply not offered, which the tests account for.
      - name: Tests
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=moderate
