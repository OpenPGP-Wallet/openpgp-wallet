name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this touch keys, signing, backups or data from third-party services? How should it stay safe?
