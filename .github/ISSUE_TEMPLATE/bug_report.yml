name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not report security vulnerabilities here**: follow
        [SECURITY.md](https://github.com/OpenPGP-Wallet/openpgp-wallet/blob/master/SECURITY.md) instead.

        Never paste a password, a backup share, a passphrase or a private key in an issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: In the installer's file name, or in Windows Settings → Apps.
      placeholder: "2.13.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network or feature concerned
      placeholder: "Solana send, THORChain swap, USB backup…"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (hide your addresses if you prefer), transaction IDs, or relevant lines from crash.log.
