[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# `panic = "abort"` deliberately REMOVED despite the size recommendation: each Tauri
# command runs on its own thread/task, so with the default behavior (unwind), an
# unexpected panic in a command only makes THAT command fail (the frontend gets an
# error) instead of instantly killing the whole process with no message or trace,
# which is what caused the app's crashes.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The `region` crate (real memory locking, see core/src/memory_guard.rs) has a
# `debug_assert!` in its LockGuard's Drop that fails intermittently under
# `cargo test`: our locked buffers are tiny (32 bytes for the entropy), so several
# DIFFERENT test buffers running in parallel can share the same memory page (rounded
# to the page, 4 KB). The second unlock of a page already unlocked by another thread
# fails on the OS side, which `region` only detects through `debug_assert!` (not a
# real error returned). This is NOT a bug that can happen in the real release binary:
# `debug-assertions` is already `false` there by default (never enabled explicitly
# above), so the assertion never runs in the shipped app; it is only a false positive
# caused by running tests in parallel. The `test` profile is aligned with that same
# behavior rather than working around it artificially (e.g. --test-threads=1), and it
# disables NONE of our own assertions (`assert!`/`assert_eq!` in our tests are not
# affected, only `debug_assert!` macros are).
[profile.test]
debug-assertions = false

# Monero: scanning blocks (one curve multiplication per transaction) takes ~27 ms
# per transaction without optimization, so a day of blocks (~20,000 transactions)
# would take 10 minutes in the development app and the tests. Only the compute
# crates are optimized; the shipped app is already fully optimized (release profile).
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.monero-ed25519]
opt-level = 3
[profile.dev.package.monero-oxide]
opt-level = 3
[profile.dev.package.monero-wallet]
opt-level = 3
[profile.dev.package.monero-clsag]
opt-level = 3
[profile.dev.package.monero-bulletproofs]
opt-level = 3
[profile.dev.package.monero-primitives]
opt-level = 3

# Shielded Zcash: syncing from the fixed birthday (16,349 blocks on 2026-10-17)
# took 355 s without optimization against 45 s optimized, measured with the
# `real_shielded_sync` test. The development app then looked stuck on "Syncing
# shielded funds". Same approach as Monero: only the crates that decrypt notes,
# hash the commitment trees, parse the compact blocks and store them are optimized
# (halo2 too, for the proofs of a shielded send).
[profile.dev.package.orchard]
opt-level = 3
[profile.dev.package.pasta_curves]
opt-level = 3
[profile.dev.package.zcash_note_encryption]
opt-level = 3
[profile.dev.package.sinsemilla]
opt-level = 3
[profile.dev.package.halo2_gadgets]
opt-level = 3
[profile.dev.package.halo2_proofs]
opt-level = 3
