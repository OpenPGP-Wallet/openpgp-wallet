[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
#
# `panic = "abort"` volontairement RETIRÉ malgré la recommandation de taille : chaque
# commande Tauri tourne sur son propre thread/tâche, donc avec le comportement par
# défaut (unwind), un panic imprévu dans une commande fait juste échouer CETTE
# commande (le frontend reçoit une erreur) au lieu de tuer instantanément tout le
# processus sans message ni trace — ce qui était la cause des crashs de l'app.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# La crate `region` (verrouillage mémoire réel, voir core/src/memory_guard.rs) contient
# un `debug_assert!` dans le Drop de son LockGuard qui échoue par intermittence sous
# `cargo test` : nos buffers verrouillés sont minuscules (32 octets pour l'entropie),
# donc plusieurs buffers de tests DIFFÉRENTS tournant en parallèle peuvent partager la
# même page mémoire (arrondi à la page, 4 Ko) — le second déverrouillage d'une page déjà
# déverrouillée par un autre thread échoue côté OS, ce que `region` détecte via
# `debug_assert!` seulement (pas une vraie erreur remontée). Ce n'est PAS un bug qui
# peut se produire dans le binaire release réel : `debug-assertions` y est déjà à
# `false` par défaut (nulle part activé explicitement ci-dessus), donc l'assertion ne
# s'exécute jamais dans l'app livrée — uniquement un faux positif de parallélisme des
# tests. On aligne le profil `test` sur ce même comportement plutôt que de contourner
# artificiellement les tests (ex: --test-threads=1), et ça ne désactive AUCUNE de nos
# propres assertions (`assert!`/`assert_eq!` dans nos tests ne sont pas concernées,
# seules les macros `debug_assert!` le sont).
[profile.test]
debug-assertions = false

# Monero : l'analyse des blocs (une multiplication de courbe par transaction)
# prend ~27 ms par transaction sans optimisation — une journée de blocs
# (~20 000 transactions) prendrait 10 minutes dans l'app de développement et
# les tests. Seules les crates de calcul sont optimisées ; l'app livrée l'est
# déjà entièrement (profil release).
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.monero-ed25519]
opt-level = 3
[profile.dev.package.monero-oxide]
opt-level = 3
[profile.dev.package.monero-wallet]
opt-level = 3
[profile.dev.package.monero-clsag]
opt-level = 3
[profile.dev.package.monero-bulletproofs]
opt-level = 3
[profile.dev.package.monero-primitives]
opt-level = 3
